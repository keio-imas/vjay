[workspace]
members = ["src/domain", "src/application", "src/infrastructure"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
vjay-domain = { path = "src/domain" }
vjay-application = { path = "src/application" }
vjay-infrastructure = { path = "src/infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
wgpu = { version = "30", features = ["glsl"] }
naga = { version = "30", features = ["glsl-in", "wgsl-out"] }
cpal = "0.16"
midir = "0.10.3"
rosc = "0.11"
rtrb = "0.3"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[package]
name = "vjay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
vjay-domain.workspace = true
vjay-application.workspace = true
vjay-infrastructure.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1

